name: Update recent X posts

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch recent posts
        env:
          TWITTER_USERNAME: ${{ vars.TWITTER_USERNAME }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: python3 scripts/fetch_twitter_posts.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/twitter.json
          if git diff --cached --quiet; then
            echo "No changes to recent posts."
          else
            git commit -m "Update recent X posts"
            git push
          fi
